image: nixos/nix

stages:
  - test
  - build
  - publish

cache:
  paths:
    - /nix/store
    - venv/
    - dist/

before_script:
  - nix-shell

lint:
  stage: test
  script:
    - nix-shell --run 'make lint'

unit tests:
  stage: test
  script:
    - nix-shell --run 'make test'
  coverage: '/TOTAL\s+\d+\s+\d+\s+([\d\.]+)%/'

build distribution files:
  stage: build
  needs:
    - lint
    - unit tests
  script:
    - nix-shell --run 'make dist'
  artifacts:
    paths:
      - dist/*.whl
      - dist/*.tar.gz

publish on pypi:
  stage: publish
  needs:
    - build distribution files
  only:
    - tags
  script:
    - nix-shell --run 'twine upload --non-interactive --disable-progress-bar -u __token__ -p "$PYPI_TOKEN" dist/*'

image: nixos/nix

stages:
  - test
  - build
  - publish

cache:
  paths:
    - /nix/store
    - venv/
    - dist/

test:
  stage: test
  script:
    - nix-shell --run 'make test'
  coverage: '/TOTAL\s+\d+\s+\d+\s+([\d\.]+)%/'

build:
  stage: build
  needs:
    - test
  script:
    - nix-shell --run 'male build'
  artifacts:
    paths:
      - dist/*.whl
      - dist/*.tar.gz

publish:
  stage: publish
  needs:
    - build
  only:
    - tags
  script:
    - nix-shell --run 'python -m twine upload -u __token__ -p $PYPI_TOKEN -r testpypi dist/*'

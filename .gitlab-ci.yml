image: nixos/nix

stages:
  - test
  - build
  - publish

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - env/
    - /nix/store
    - dist/

test:
  stage: test
  script:
    - nix-shell --run 'pytest --cov=pi18n tests/unitests.py'

build:
  stage: build
  needs:
    - test
  script:
    - nix-shell --run 'python -m build'
  artifacts:
    paths:
      - dist/*.whl
      - dist/*.tar.gz

publish:
  stage: publish
  needs:
    - build
  only:
    - tags
  script:
    - nix-shell --run 'python -m twine upload --repository pi18n dist/*'
